name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 3 * * 1" # weekly, Monday 03:xx UTC (live tests cost about 2 credits)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B test

  live:
    name: Live API
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Waits for approval from a required reviewer of the "live" environment (it spends credits).
    environment: live
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test -Plive
        env:
          RUNCONVERT_API_KEY: ${{ secrets.RUNCONVERT_API_KEY }}
